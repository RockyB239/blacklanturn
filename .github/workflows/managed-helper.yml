name: Managed Helper release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh
          python -m pip install requests==2.32.5 Pillow==11.1.0
      - name: Download immutable clean baselines
        run: |
          mkdir -p baselines
          for edition in General Apple-TV-Mac; do
            curl --fail --location --retry 3 "https://github.com/RockyB239/blacklanturn/releases/download/v1.1.2/BlackLanturn-${edition}-Kodi21-1.1.2.zip" -o "baselines/BlackLanturn-${edition}-Kodi21-1.1.2.zip"
          done
      - name: Download pinned update baselines
        run: |
          for edition in General Apple-TV-Mac; do
            curl --fail --location --retry 3 "https://github.com/RockyB239/blacklanturn/releases/download/v1.1.29/BlackLanturn-${edition}-Kodi21-1.1.29.zip" -o "baselines/BlackLanturn-${edition}-Kodi21-1.1.29.zip"
          done
      - name: Download pinned artwork release baselines
        run: |
          for edition in General Apple-TV-Mac; do
            curl --fail --location --retry 3 "https://github.com/RockyB239/blacklanturn/releases/download/v1.1.30/BlackLanturn-${edition}-Kodi21-1.1.30.zip" -o "baselines/BlackLanturn-${edition}-Kodi21-1.1.30.zip"
          done
      - name: Download pinned landscape release baselines
        run: |
          for edition in General Apple-TV-Mac; do
            curl --fail --location --retry 3 "https://github.com/RockyB239/blacklanturn/releases/download/v1.1.32/BlackLanturn-${edition}-Kodi21-1.1.32.zip" -o "baselines/BlackLanturn-${edition}-Kodi21-1.1.32.zip"
          done
      - name: Download pinned current-addon baseline
        run: |
          for edition in General Apple-TV-Mac; do
            curl --fail --location --retry 3 "https://github.com/RockyB239/blacklanturn/releases/download/v1.1.33/BlackLanturn-${edition}-Kodi21-1.1.33.zip" -o "baselines/BlackLanturn-${edition}-Kodi21-1.1.33.zip"
          done
      - name: Download pinned provider release baseline
        run: |
          for edition in General Apple-TV-Mac; do
            curl --fail --location --retry 3 "https://github.com/RockyB239/blacklanturn/releases/download/v1.1.34/BlackLanturn-${edition}-Kodi21-1.1.34.zip" -o "baselines/BlackLanturn-${edition}-Kodi21-1.1.34.zip"
          done
      - name: Download pinned customization baseline
        run: |
          for edition in General Apple-TV-Mac; do
            curl --fail --location --retry 3 "https://github.com/RockyB239/blacklanturn/releases/download/v1.1.35/BlackLanturn-${edition}-Kodi21-1.1.35.zip" -o "baselines/BlackLanturn-${edition}-Kodi21-1.1.35.zip"
          done
      - name: Download pinned Options release baseline
        run: |
          for edition in General Apple-TV-Mac; do
            curl --fail --location --retry 3 "https://github.com/RockyB239/blacklanturn/releases/download/v1.1.36/BlackLanturn-${edition}-Kodi21-1.1.36.zip" -o "baselines/BlackLanturn-${edition}-Kodi21-1.1.36.zip"
          done
      - name: Download pinned personal-library baseline
        run: |
          for edition in General Apple-TV-Mac; do
            curl --fail --location --retry 3 "https://github.com/RockyB239/blacklanturn/releases/download/v1.1.37/BlackLanturn-${edition}-Kodi21-1.1.37.zip" -o "baselines/BlackLanturn-${edition}-Kodi21-1.1.37.zip"
          done
      - name: Download pinned refinement baseline
        run: |
          for edition in General Apple-TV-Mac; do
            curl --fail --location --retry 3 "https://github.com/RockyB239/blacklanturn/releases/download/v1.1.38/BlackLanturn-${edition}-Kodi21-1.1.38.zip" -o "baselines/BlackLanturn-${edition}-Kodi21-1.1.38.zip"
          done
      - name: Download pinned notice-history baseline
        run: |
          curl --fail --location --retry 2 -o baselines/BlackLanturn-General-Kodi21-1.1.39.zip https://github.com/RockyB239/blacklanturn/releases/download/v1.1.39/BlackLanturn-General-Kodi21-1.1.39.zip
          curl --fail --location --retry 2 -o baselines/BlackLanturn-Apple-TV-Mac-Kodi21-1.1.39.zip https://github.com/RockyB239/blacklanturn/releases/download/v1.1.39/BlackLanturn-Apple-TV-Mac-Kodi21-1.1.39.zip
      - name: Download current public baseline
        run: |
          for edition in General Apple-TV-Mac; do
            curl --fail --location --retry 3 "https://github.com/RockyB239/blacklanturn/releases/download/v1.1.40/BlackLanturn-${edition}-Kodi21-1.1.40.zip" -o "baselines/BlackLanturn-${edition}-Kodi21-1.1.40.zip"
          done
      - name: Download pinned reliability baseline
        run: |
          for edition in General Apple-TV-Mac; do
            curl --fail --location --retry 3 "https://github.com/RockyB239/blacklanturn/releases/download/v1.1.57/BlackLanturn-${edition}-Kodi21-1.1.57.zip" -o "baselines/BlackLanturn-${edition}-Kodi21-1.1.57.zip"
          done
      - name: Download pinned 1.1.58 packaging baselines
        run: |
          for edition in General Apple-TV-Mac; do
            curl --fail --location --retry 3 "https://github.com/RockyB239/blacklanturn/releases/download/v1.1.58/BlackLanturn-${edition}-Kodi21-1.1.58.zip" -o "baselines/BlackLanturn-${edition}-Kodi21-1.1.58.zip"
          done
      - name: Download pinned 1.1.59 packaging baselines
        run: |
          for edition in General Apple-TV-Mac; do
            curl --fail --location --retry 3 "https://github.com/RockyB239/blacklanturn/releases/download/v1.1.59/BlackLanturn-${edition}-Kodi21-1.1.59.zip" -o "baselines/BlackLanturn-${edition}-Kodi21-1.1.59.zip"
          done
      - name: Download pinned 1.1.60 packaging baselines
        run: |
          for edition in General Apple-TV-Mac; do
            curl --fail --location --retry 3 "https://github.com/RockyB239/blacklanturn/releases/download/v1.1.60/BlackLanturn-${edition}-Kodi21-1.1.60.zip" -o "baselines/BlackLanturn-${edition}-Kodi21-1.1.60.zip"
          done
      - name: Download pinned 1.1.61-r1 packaging baselines
        run: |
          for edition in General Apple-TV-Mac; do
            curl --fail --location --retry 3 "https://github.com/RockyB239/blacklanturn/releases/download/v1.1.61/BlackLanturn-${edition}-Kodi21-1.1.61.zip" -o "baselines/BlackLanturn-${edition}-Kodi21-1.1.61.zip"
          done
          python - <<'PYCODE'
          import hashlib
          from pathlib import Path
          pins = {'General': 'abe0beb95868e07fde1ef276e7e9adb72e79728eb063bcac5849178a9a78c7a4', 'Apple-TV-Mac': 'e41855a60c24e19299002b593a529d0e6dc91e6ebee73497883bfae9f874e8fc'}
          for edition, pin in pins.items():
              assert hashlib.sha256(Path(f'baselines/BlackLanturn-{edition}-Kodi21-1.1.61.zip').read_bytes()).hexdigest() == pin
          PYCODE
      - name: Installer and update protection tests
        run: python -m unittest discover -s tests -v
      - name: Controller regression checks
        run: PYTHONPATH=controller-source/addon python -m unittest discover -s controller-source/tests -v
      - name: Source-selection and playback lifecycle checks
        run: python -m unittest discover -s compatibility/autoplay-size/tests -v
      - name: Coco source concurrency regressions
        run: python -m unittest discover -s compatibility/addons152/coco-tests -v
      - name: Native probe regression checks
        run: python -m unittest discover -s tools/device_validation -p 'test_*.py'
      - name: YouTube context regression checks
        run: python -m unittest discover -s compatibility/youtube-context/tests -v
      - name: Retained 1.1.30 source-bound performance evidence
        run: python tools/device_validation/verify_performance_evidence.py validation/optimization130-performance.json --manifest controller-source/manifest96.json
      - name: Verify branded icons in both full and component editions
        run: |
          python tools/build_release165.py --baselines baselines --output artifacts155
          python tools/verify_release165.py --artifacts artifacts155 --baselines baselines --output artifacts155/package-matrix.json
          python -m unittest discover -s compatibility/upnext155/tests -p test_upnext132_source.py -v
          UPNEXT132_RELEASE_DIR=artifacts155 python -m unittest discover -s compatibility/reliability165/tests -v
          python tools/release_report.py artifacts155/BlackLanturn-General-Kodi21-1.1.58.zip --output artifacts155/current-general.json
          python tools/release_report.py artifacts155/BlackLanturn-Apple-TV-Mac-Kodi21-1.1.58.zip --output artifacts155/current-apple.json
      - name: Verify 1.1.59 full and component packages against historical source
        run: |
          source170="$RUNNER_TEMP/blacklanturn-source170"
          git worktree add --detach "$source170" 563ba2cd87b5977cb337ba3928f46d820916beec
          python "$source170/tools/build_release170.py" --freeze source170.json
          python "$source170/tools/build_release170.py" --manifest source170.json --baselines baselines --output artifacts170
          python tools/verify_release165.py --baseline-version 1.1.58 --installer-version 1.0.53 --artifacts artifacts170 --baselines baselines --output artifacts170/package-matrix.json
      - name: Verify 1.1.60 full and component packages against historical source
        run: |
          source173="$RUNNER_TEMP/blacklanturn-source173"
          git worktree add --detach "$source173" ab112fd5d91352fd8b3a1a124123cae4c7c1d698
          python "$source173/tools/build_release173.py" --freeze source173.json
          python "$source173/tools/build_release173.py" --manifest source173.json --baselines baselines --output artifacts173
          python tools/verify_release165.py --baseline-version 1.1.59 --installer-version 1.0.53 --artifacts artifacts173 --baselines baselines --output artifacts173/package-matrix.json
      - name: Verify 1.1.61 full and component packages against historical source
        run: |
          source174="$RUNNER_TEMP/blacklanturn-source174"
          git worktree add --detach "$source174" 52d86137ef26ceeb9d254f77368cd0245493760b
          python "$source174/tools/build_release174.py" --freeze source174.json
          python "$source174/tools/build_release174.py" --manifest source174.json --baselines baselines --output artifacts174
          python tools/verify_release165.py --baseline-version 1.1.60 --installer-version 1.0.53 --artifacts artifacts174 --baselines baselines --output artifacts174/package-matrix.json
      - name: Preview transport ownership and fallback regressions in both editions
        run: |
          for edition in general apple; do
            BLACKLANTURN_PREVIEW_EDITION="$edition" python -m unittest discover -s compatibility/responsiveness179/tests -v
          done
      - name: Verify reproducible 1.1.62 full and component packages
        run: |
          python compatibility/responsiveness179/release179.py freeze --baselines baselines --output source179
          python source179/pipeline/release179.py build --snapshot source179 --baselines baselines --output artifacts179
          python source179/pipeline/verify179.py --snapshot source179 --artifacts artifacts179 --baselines baselines --output artifacts179-verification.json
          python source179/pipeline/release179.py build --snapshot source179 --baselines baselines --output rebuild179
          cmp artifacts179/SHA256SUMS rebuild179/SHA256SUMS
